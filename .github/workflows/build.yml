name: Eww development CI

# Build commits directly on development branches; never run this CI on master.
# GitHub's workflow_dispatch requires the file on the default branch, so
# push to feature/** is the entry point until/if this workflow is merged there.
on:
  push:
    branches:
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: eww-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Eww native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libdbusmenu-gtk3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # Build with the intended Wayland-only feature first. This catches
      # type errors in the new eventbox/gtk-layer-shell implementation.
      - name: Compile Eww (Wayland only)
        run: cargo check -p eww --no-default-features --features wayland

      - name: Compile Eww (default backends)
        run: cargo check -p eww

      - name: Compile Eww (X11 only)
        run: cargo check -p eww --no-default-features --features x11

      - name: Compile Eww (without a backend)
        run: cargo check -p eww --no-default-features

      - name: Run Rust unit tests
        run: cargo test --workspace

      - name: Build Wayland binary and smoke-check CLI
        run: |
          cargo build -p eww --no-default-features --features wayland
          ./target/debug/eww --version

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
